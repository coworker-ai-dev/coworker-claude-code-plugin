# Keeps app.coworker.ai's hosted plugin artifacts in sync with this repo.
#
# On every push to main, rebuilds public/plugin/ (zip + marketplace.json) using
# core's own build script and opens/updates a PR against villagelabsco/core
# develop. No changes to the built artifacts → no PR.
#
# Requires the CORE_RELEASE_TOKEN secret: a token with contents+pull-request
# write access on villagelabsco/core.
name: Release plugin to core

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Checkout core
        uses: actions/checkout@v4
        with:
          repository: villagelabsco/core
          ref: develop
          token: ${{ secrets.CORE_RELEASE_TOKEN }}
          path: core

      - name: Build zip + marketplace.json
        run: core/frontend-main/scripts/build-claude-plugin-zip.sh "$GITHUB_WORKSPACE/plugin"

      - name: Read plugin version
        id: version
        run: echo "version=$(node -p "require('$GITHUB_WORKSPACE/plugin/.claude-plugin/plugin.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open PR against core
        uses: peter-evans/create-pull-request@v7
        with:
          path: core
          token: ${{ secrets.CORE_RELEASE_TOKEN }}
          branch: chore/plugin-release
          base: develop
          commit-message: "chore(plugin): release coworker plugin v${{ steps.version.outputs.version }} (${{ github.sha }})"
          title: "chore(plugin): release coworker plugin v${{ steps.version.outputs.version }}"
          body: |
            Auto-generated by [release-to-core](https://github.com/coworker-ai-dev/coworker-claude-code-plugin/blob/main/.github/workflows/release-to-core.yml) on push to plugin main (${{ github.sha }}).

            Regenerates `frontend-main/public/plugin/` (plugin zip + marketplace.json with new sha256/version). The hosted marketplace and the Coworker Anywhere zip download serve these files.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
